<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Una invitación digital única para celebrar mis 15 años.">
    <meta name="theme-color" content="#e8d9f7">

    <title>Mis 15 Años | Invitación</title>

    <link rel="icon" type="image/png" href="./assets/img/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@400;500;600&family=Italianno&family=Cinzel:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/styles.css">
    <script src="./assets/js/main.js" defer></script>
</head>

<body>
    <main class="invitacion">

        <section class="imagenPrincipal" id="portada" aria-label="Portada de la invitación">

            <img class="imagenPrincipalFoto" src="./assets/img/imagen-principal.png"
                alt="Portada de la invitación de quince años">

            <div class="imagenPrincipalTexto">
                <span class="imagenPrincipalCorona" aria-hidden="true">♕</span>

                <p class="imagenPrincipalTitulo">MIS 15 AÑOS</p>

                <h1 class="imagenPrincipalNombre">Josefina</h1>

                <div class="imagenPrincipalDetalle">
                    <span></span>

                    <button class="botonInvitacion" id="abrirInvitacion" type="button"
                        aria-label="Abrir invitación de quince años">
                        <svg class="corazonInvitacion" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true">

                            <path class="corazonRelleno"
                                d="M100 165 C85 150 15 104 15 55 C15 18 62 5 100 43 C138 5 185 18 185 55 C185 104 115 150 100 165Z"
                                fill="url(#violetaCorazon)" stroke="#f0d5ff" stroke-width="2" />

                            <path d="M100 151 C80 132 29 96 29 57 C29 36 52 25 73 43" fill="none" stroke="#ffffff"
                                stroke-opacity=".45" stroke-width="2" stroke-linecap="round" />
                        </svg>

                        <span class="textoBotonInvitacion">abrir</span>
                    </button>

                    <span></span>
                </div>

                <p class="imagenPrincipalFrase">
                    Un sueño, una noche, un momento inolvidable...
                </p>
            </div>

            <span class="brillo brilloUno" aria-hidden="true"></span>
            <span class="brillo brilloDos" aria-hidden="true"></span>
            <span class="brillo brilloTres" aria-hidden="true"></span>
        </section>

        <section class="interiorInvitacion" id="interiorInvitacion" aria-label="Invitación de quince años"
            aria-hidden="true" hidden>

            <div class="tarjetaInvitacion">
                <p class="interiorPreTitulo">UN MOMENTO MÁGICO</p>

                <p class="interiorMensaje">
                    Se comparte con personas especiales
                </p>

                <div class="numeroQuince">
                    <span class="numeroQuinceTexto">15</span>
                    <span class="numeroQuincePalabra">Mis Quince</span>
                </div>

                <h2 class="interiorNombre">Josefina</h2>

                <div class="separadorBrillante" aria-hidden="true">
                    <span>✧</span>
                </div>

                <p class="interiorFrase">
                    Una noche soñada, un recuerdo para siempre.
                </p>


                <div class="fechaEvento">
                    <p class="fechaEventoDia">20.11.24</p>

                </div>

                <div class="datosFiesta">


                    <span class="datoSeparador" aria-hidden="true"></span>

                    <div class="datoFiesta">
                        <p class="fechaEventoHora">20:00 HS</p>
                    </div>

                    <span class="datoSeparador" aria-hidden="true"></span>

                    <div class="datoFiesta">


                        <div class="datoUbicacion">
                            <p class="datoUbicacionNombre">KEOPS · VILLA CARLOS PAZ</p>
                            <a class="botonUbicacion"
                                href="https://www.google.com/maps/search/?api=1&query=Keops+Villa+Carlos+Paz"
                                target="_blank" rel="noopener noreferrer">
                                Ver ubicación
                            </a>
                        </div>

                    </div>
                </div>


            </div>

            <span class="destelloInterior destelloInteriorUno" aria-hidden="true">✦</span>
            <span class="destelloInterior destelloInteriorDos" aria-hidden="true">✧</span>
            <span class="destelloInterior destelloInteriorTres" aria-hidden="true">✦</span>
            <span class="destelloInterior destelloInteriorCuatro" aria-hidden="true">✧</span>
        </section>

    </main>
</body>

</html>
